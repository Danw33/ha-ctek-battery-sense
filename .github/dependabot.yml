version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Match HA 2026.11.1's Bluetooth manifest; revise with the HA target.
    ignore:
      - dependency-name: bleak
        versions: [">3.0.2"]
      - dependency-name: dbus-fast
        versions: [">5.0.22"]
    groups:
      home-assistant:
        patterns: ["homeassistant", "pytest-homeassistant"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
