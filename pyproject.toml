[tool.pytest.ini_options]
addopts = "--strict-markers --cov=custom_components.ctek_battery_sense --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 88
src = ["custom_components", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/ctek_battery_sense"]
explicit_package_bases = true
mypy_path = "."
